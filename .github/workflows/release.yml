name: Release

# Builds installers on Windows, macOS and Linux and attaches them to ONE release.
# Runs when Release Please creates a release (see release-please.yml), or when a
# version tag is pushed by hand: `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: The version tag to build, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write # create the release and upload installers

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
      # Created once here, so the three build jobs below all upload to the same
      # release instead of racing to create one each.
      - name: Create the draft release (if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi

  publish:
    name: Build and upload (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          # One macOS runner builds for both Apple Silicon and Intel Macs.
          - os: macos-latest
            arch: arm64,x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - run: npm ci
      # Never publish an app that fails its tests.
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - run: npm run publish -- --arch=${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
