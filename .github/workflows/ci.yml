name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Test and build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          # Same as the release: Apple Silicon and Intel Macs.
          - os: macos-latest
            arch: arm64,x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - run: npm ci
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - run: npm run make -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
