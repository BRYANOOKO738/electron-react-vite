name: Labeler

# Adds labels to pull requests based on the files they change
# (rules in .github/labeler.yml), so it is easy to see what each one touches.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
