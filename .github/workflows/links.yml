name: Links

# Checks that the web links in the README and documentation still work.
on:
  pull_request:
    paths: ['docs/**', '*.md']
  schedule:
    - cron: '17 5 * * 1' # every Monday: websites move
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Only web links: the docs' own pages are checked by `npm run docs:build`.
          # Excluded: this project's docs site (pages may not be deployed yet), the latest
          # release (404 until the first release) and pages that need a signed-in user.
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude-path node_modules
            --exclude '^https://bryanooko738\.github\.io/electron-react-vite/'
            --exclude '/releases/latest'
            --exclude '/security/advisories/new'
            --exclude '/issues/new'
            --exclude '/edit/main/'
            './**/*.md'
          fail: true
